name: Feature Request
description: Suggest an idea or enhancement for Rime
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing to Rime! Please describe the feature you would like to see.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use Case / Context
      description: How does this improve your PDF reading and study flow?
    validations:
      required: false
